spring:
  application:
    name: ai-healthcare
  datasource:
    url: jdbc:mysql://localhost:3306/healthcare
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  profiles:
    active: local

jwt:
  secret: healthcare-secret-key-must-be-at-least-32-characters-long
  expiration: 86400000

server:
  port: 8081

hira:
  api:
    service-key: ${HIRA_SERVICE_KEY}